<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaCrawler - 终端日志</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0c0c0c;
            --toolbar-bg: #1a1a2e;
            --border: #2a2a3e;
            --text: #e0e0e0;
            --text-muted: #888;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .toolbar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 8px;
            white-space: nowrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tab-btn {
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .action-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .action-btn:hover { border-color: #555; color: var(--text); }

        .spacer { flex: 1; }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.connected { background: var(--success); }
        .status-dot.disconnected { background: var(--danger); }
        .status-dot.connecting { background: var(--warning); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .status-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        .link-btn {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.15s;
        }
        .link-btn:hover { color: var(--text); border-color: #555; }

        #terminal-container {
            flex: 1;
            padding: 4px;
            overflow: hidden;
        }

        .xterm { height: 100%; }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">LOG</span>
        <div class="toolbar-group" id="file-tabs"></div>

        <span class="spacer"></span>

        <button class="action-btn" onclick="clearTerminal()" title="清屏">清屏</button>
        <button class="action-btn" id="pauseBtn" onclick="togglePause()" title="暂停/恢复自动滚动">暂停</button>

        <div class="toolbar-group" style="margin-left: 8px;">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">连接中...</span>
        </div>

        <a href="/dashboard" class="link-btn" style="margin-left: 8px;">Dashboard</a>
        <a href="/login" class="link-btn">登录</a>
    </div>

    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
    (function() {
        const LOG_FILES = [
            { name: 'crawler.log', label: '爬虫日志' },
            { name: 'session_keeper.log', label: 'Session' },
            { name: 'api.log', label: 'API' },
        ];

        const basePath = (() => { const p = window.location.pathname; const segs = ['control','dashboard','login','shell','terminal','notuse','api']; const m = p.match(/^(\/[^/]+)(?:\/|$)/); if (!m) return ''; const first = m[1].substring(1); return segs.includes(first) ? '' : m[1]; })();
        let currentFile = 'crawler.log';
        let ws = null;
        let paused = false;
        let reconnectTimer = null;
        let term = null;
        let fitAddon = null;

        // Init xterm
        term = new window.Terminal({
            theme: {
                background: '#0c0c0c',
                foreground: '#d4d4d4',
                cursor: '#d4d4d4',
                cursorAccent: '#0c0c0c',
                selectionBackground: 'rgba(255,255,255,0.2)',
                black: '#1e1e1e',
                red: '#f44747',
                green: '#6a9955',
                yellow: '#dcdcaa',
                blue: '#569cd6',
                magenta: '#c586c0',
                cyan: '#4ec9b0',
                white: '#d4d4d4',
                brightBlack: '#808080',
                brightRed: '#f44747',
                brightGreen: '#6a9955',
                brightYellow: '#dcdcaa',
                brightBlue: '#569cd6',
                brightMagenta: '#c586c0',
                brightCyan: '#4ec9b0',
                brightWhite: '#ffffff',
            },
            fontSize: 13,
            fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace",
            lineHeight: 1.35,
            cursorBlink: false,
            cursorStyle: 'underline',
            scrollback: 10000,
            convertEol: true,
            disableStdin: true,
        });

        fitAddon = new window.FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        window.addEventListener('resize', () => { fitAddon.fit(); });

        // Build file tabs
        const tabContainer = document.getElementById('file-tabs');
        LOG_FILES.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (f.name === currentFile ? ' active' : '');
            btn.textContent = f.label;
            btn.dataset.file = f.name;
            btn.onclick = () => switchFile(f.name);
            tabContainer.appendChild(btn);
        });

        function updateTabs() {
            tabContainer.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === currentFile);
            });
        }

        function setStatus(state) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot ' + state;
            const labels = { connected: '已连接', disconnected: '已断开', connecting: '连接中...' };
            text.textContent = labels[state] || state;
        }

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
            }
            setStatus('connecting');

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const token = localStorage.getItem('mc_token') || '';
            const url = `${proto}//${location.host}${basePath}/api/terminal/ws?token=${encodeURIComponent(token)}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                setStatus('connected');
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            };

            ws.onmessage = (e) => {
                if (!paused) {
                    term.write(e.data);
                }
            };

            ws.onclose = () => {
                setStatus('disconnected');
                scheduleReconnect();
            };

            ws.onerror = () => {
                setStatus('disconnected');
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connect();
            }, 3000);
        }

        function switchFile(name) {
            if (name === currentFile) return;
            currentFile = name;
            updateTabs();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'switch', file: name }));
            }
        }

        window.clearTerminal = function() {
            term.clear();
        };

        window.togglePause = function() {
            paused = !paused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = paused ? '恢复' : '暂停';
            btn.style.color = paused ? '#f59e0b' : '';
            btn.style.borderColor = paused ? '#f59e0b' : '';
        };

        // Start
        connect();
    })();
    </script>
</body>
</html>
